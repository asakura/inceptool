version: 2
updates:
  # Direct dependencies only: transitive ones are batched into one weekly PR
  # by cargo-lock-update.yml (Dependabot cannot split the two by schedule).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      # init/analyze must run the same version or analyze aborts.
      codeql-action:
        patterns: ["github/codeql-action*"]
