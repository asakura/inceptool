name: Set up Nix
description: Install Nix and configure the inceptool Cachix cache
inputs:
  cachix-auth-token:
    description: Push-capable token. Leave empty for read-only cache access.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: inceptool
        authToken: ${{ inputs.cachix-auth-token }}
