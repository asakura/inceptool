name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload-binaries:
    name: Build & upload (${{ matrix.target }})
    # No `pull_request` trigger exists for this workflow at all (release
    # events only); this guard additionally no-ops the job if a fork happens
    # to publish its own release with this same workflow file. Only the
    # `inceptool` binary crate uses a bare `vX.Y.Z` tag (library crates are
    # tagged `<crate>-vX.Y.Z`), so `startsWith(tag, 'v')` selects exactly the
    # CLI release.
    if: github.repository_owner == 'asakura' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            package: inceptool-x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            package: inceptool-aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23


      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: inceptool
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build static binary
        run: nix build ".#${{ matrix.package }}" -L

      - name: Package archive
        run: |
          set -euo pipefail
          stage="inceptool-${{ github.event.release.tag_name }}-${{ matrix.target }}"
          mkdir "$stage"
          cp result/bin/inceptool "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            inceptool-*.tar.gz inceptool-*.tar.gz.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

  upload-sbom:
    name: Generate & upload SBOM
    if: github.repository_owner == 'asakura' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: inceptool
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build SBOM
        run: nix build ".#inceptool-sbom" -L

      - name: Upload SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sbom="inceptool-${{ github.event.release.tag_name }}.cdx.json"
          cp result/inceptool.cdx.json "$sbom"
          sha256sum "$sbom" > "$sbom.sha256"
          gh release upload "${{ github.event.release.tag_name }}" \
            "$sbom" "$sbom.sha256" \
            --repo "${{ github.repository }}" \
            --clobber
