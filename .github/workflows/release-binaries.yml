name: Release Binaries

# Not triggered by `release: published`: release-plz creates the release with
# GITHUB_TOKEN, and events raised by that token never start other workflows.
# release-plz.yml calls this workflow instead; `workflow_dispatch` allows
# backfilling assets for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v0.3.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v0.3.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-binaries:
    name: Build & upload (${{ matrix.target }})
    # No `pull_request` trigger exists for this workflow at all; this guard
    # additionally no-ops the job on forks. Only the
    # `inceptool` binary crate uses a bare `vX.Y.Z` tag (library crates are
    # tagged `<crate>-vX.Y.Z`), so `startsWith(tag, 'v')` selects exactly the
    # CLI release.
    if: github.repository_owner == 'asakura' && startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            package: inceptool-x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            package: inceptool-aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23


      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: inceptool
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build static binary
        run: nix build ".#${{ matrix.package }}" -L

      - name: Package archive
        run: |
          set -euo pipefail
          stage="inceptool-${{ inputs.tag }}-${{ matrix.target }}"
          mkdir "$stage"
          cp result/bin/inceptool "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            inceptool-*.tar.gz inceptool-*.tar.gz.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

  upload-sbom:
    name: Generate & upload SBOM
    if: github.repository_owner == 'asakura' && startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: inceptool
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build SBOM
        run: nix build ".#inceptool-sbom" -L

      - name: Upload SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sbom="inceptool-${{ inputs.tag }}.cdx.json"
          cp result/inceptool.cdx.json "$sbom"
          sha256sum "$sbom" > "$sbom.sha256"
          gh release upload "${{ inputs.tag }}" \
            "$sbom" "$sbom.sha256" \
            --repo "${{ github.repository }}" \
            --clobber
