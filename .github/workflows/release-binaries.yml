name: Release Binaries

# Not triggered by `release: published`: release-plz creates the release with
# GITHUB_TOKEN, and events raised by that token never start other workflows.
# release-plz.yml calls this workflow instead (that workflow itself runs via
# `workflow_run`, after CI passes on main); `workflow_dispatch` allows
# backfilling assets for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v0.3.3)
        required: true
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v0.3.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-binaries:
    name: Build & upload (${{ matrix.target }})
    # No `pull_request` trigger exists for this workflow at all; this guard
    # additionally no-ops the job on forks. Only the
    # `inceptool` binary crate uses a bare `vX.Y.Z` tag (library crates are
    # tagged `<crate>-vX.Y.Z`), so `startsWith(tag, 'v')` selects exactly the
    # CLI release.
    if: github.repository_owner == 'asakura' && startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            package: inceptool-x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            package: inceptool-aarch64-linux-musl
    steps:
      # Build the tag being released, not whatever ref a manual backfill was
      # dispatched from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- actionlint rejects `$/` (no ref)
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build static binary
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix build ".#${PACKAGE}" -L

      - name: Package archive
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="inceptool-${TAG}-${TARGET}"
          mkdir "$stage"
          cp result/bin/inceptool "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: inceptool-*.tar.gz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            inceptool-*.tar.gz inceptool-*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  upload-sbom:
    name: Generate & upload SBOM
    if: github.repository_owner == 'asakura' && startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- actionlint rejects `$/` (no ref)
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build SBOM
        run: nix build ".#inceptool-sbom" -L

      - name: Stage SBOM
        env:
          TAG: ${{ inputs.tag }}
        run: cp result/inceptool.cdx.json "inceptool-${TAG}.cdx.json"

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: inceptool-*.cdx.json

      - name: Upload SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sbom="inceptool-${TAG}.cdx.json"
          sha256sum "$sbom" > "$sbom.sha256"
          gh release upload "$TAG" \
            "$sbom" "$sbom.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
