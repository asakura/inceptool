name: Update Cargo.lock

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-cargo-lock:
    if: github.repository_owner == 'asakura'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-nix

      - name: Run cargo update and check what changed
        id: cargo_update
        run: nix develop -c bash .github/scripts/update-cargo-lock.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          title: "chore(cargo): update transitive dependencies in Cargo.lock"
          commit-message: "chore(cargo): update transitive dependencies in Cargo.lock"
          branch: "chore/update-cargo-lock"
          delete-branch: true
          labels: |
            dependencies
            automated
