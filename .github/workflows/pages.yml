name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# GitHub's recommended pattern for Pages deploys: queue rather than cancel, in
# a group separate from the `ci.yml` workflow's.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- actionlint rejects `$/` (no ref)
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Run the workspace test suite once under coverage instrumentation,
      # without generating a report yet, so the html and json reports below
      # can both be rendered from the same profile data.
      - name: cargo llvm-cov nextest --workspace
        run: nix develop -c cargo llvm-cov nextest --workspace --no-report

      - name: Generate HTML report
        run: nix develop -c cargo llvm-cov report --html

      - name: Generate coverage badge
        run: |
          set -euo pipefail
          nix develop -c cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          jq -f .github/scripts/coverage-badge.jq coverage-summary.json > target/llvm-cov/html/coverage.json

      - name: Generate cargo-deny badge
        run: |
          set -euo pipefail
          # Run cargo deny, ignoring exit code so we can still generate the badge on failure
          nix develop -c cargo deny --workspace --format json check 2> deny.json || true
          grep '^{' deny.json | jq -rs -f .github/scripts/deny-badge.jq > target/llvm-cov/html/cargo-deny.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/llvm-cov/html

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
