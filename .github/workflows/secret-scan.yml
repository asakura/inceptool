name: Secret scan

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: scans only the commits a PR adds.
  gitleaks-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      # `--inputs-from .` pins the tools to the nixpkgs revision in flake.lock.
      - name: gitleaks (PR commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nix run --inputs-from . nixpkgs#gitleaks -- detect --redact --no-banner \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

  # Slow sweep: full history, re-verifies old credentials and applies newly
  # released detector rules. Skipped when main has had no commits this week.
  full-history:
    if: github.event_name != 'pull_request' && github.repository_owner == 'asakura'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: check for new commits
        id: recent
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] \
            && [ -z "$(git log --since='7 days ago' -1 --format=%H origin/main)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.recent.outputs.run == 'true'
        uses: ./.github/actions/setup-nix

      - name: gitleaks (all history)
        if: steps.recent.outputs.run == 'true'
        run: |
          nix run --inputs-from . nixpkgs#gitleaks -- detect --redact --no-banner \
            --log-opts="--all"

      - name: trufflehog (verified only)
        if: steps.recent.outputs.run == 'true'
        run: |
          nix run --inputs-from . nixpkgs#trufflehog -- git file://. \
            --only-verified --fail

  # A scheduled failure only reaches the owner via GitHub's default
  # notifications, which are easy to miss or disabled. An open issue is a
  # visible, trackable record; one issue is reused until it is closed.
  notify:
    needs: full-history
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="The scheduled full-history scan found a possible secret or failed to run: ${RUN_URL}

          Treat any finding as compromised: rotate the credential first; rewriting history alone is not enough."
          export BODY
          bash .github/scripts/upsert-issue.sh comment "Secret scan failed on main history"
