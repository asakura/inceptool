name: CodeQL alerts

# Runs after the weekly CodeQL scan finishes, rather than on a cron that
# assumes the scan was done within an hour. `workflow_run` always executes the
# workflow file from the default branch.
on:
  # zizmor: ignore[dangerous-triggers] -- only reads alert metadata through the
  # API and never checks out or runs code from the triggering run.
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Code scanning alerts only show up in the Security tab. An open issue
  # triggers a GitHub notification email and tracks the backlog; one issue is
  # reused (and refreshed) until it is closed.
  open-issue:
    if: >-
      github.repository_owner == 'asakura' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: open, refresh or close issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Open CodeQL alerts
        run: |
          # shellcheck disable=SC2016
          alerts=$(gh api --paginate "repos/${GH_REPO}/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | "- [\(.rule.security_severity_level // .rule.severity)] `\(.rule.id)` at `\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)` ([alert #\(.number)](\(.html_url)))"')
          if [ -z "${alerts}" ]; then
            echo "No open alerts."
            BODY="No open code scanning alerts remain." bash .github/scripts/upsert-issue.sh close "${TITLE}"
            exit 0
          fi
          BODY=$(printf 'Open code scanning alerts on the default branch:\n\n%s\n\nTriage in the Security tab: dismiss false positives with a reason, or fix the finding.' "${alerts}")
          export BODY
          bash .github/scripts/upsert-issue.sh replace "${TITLE}"
