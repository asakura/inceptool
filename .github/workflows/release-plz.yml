name: Release-plz

# Runs only after CI has completed successfully for a push to main, so nothing
# is published from a commit that failed its checks. `workflow_run` always
# executes the workflow file from the default branch.
on:
  # zizmor: ignore[dangerous-triggers] -- both jobs are gated on a successful
  # CI run of a push to this repository's main, and only ever check out main,
  # never the triggering run's code.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # Publishes pending crates.io releases / GitHub releases for crates whose
  # version was already bumped (i.e. a release-plz PR was merged).
  release-plz-release:
    name: Release-plz release
    # The `event == 'push'` and `head_repository` checks are mandatory: a PR
    # opened from a fork's own `main` also matches `branches: [main]`, and
    # `conclusion == 'success'` alone would let it through. The owner guard
    # additionally no-ops the job on forks.
    if: >-
      github.repository_owner == 'asakura' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    outputs:
      # Tag of the `inceptool` GitHub release created by this run, or empty.
      tag: ${{ steps.cli-tag.outputs.tag }}
    steps:
      # Check out the branch, not `head_sha`, so release-plz does not run on a
      # detached HEAD.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # If main has moved on since the CI run that triggered this one, that
      # newer commit's own CI run will release, with its own checks behind it.
      - name: Skip if a newer commit exists
        id: fresh
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "main is ahead of $HEAD_SHA; leaving the release to the newer CI run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.fresh.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable # pin-comment: no vX.Y.Z tag upstream

      - name: Run release-plz
        id: release
        if: steps.fresh.outputs.skip != 'true'
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Extract CLI release tag
        id: cli-tag
        if: steps.fresh.outputs.skip != 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(jq -r '[.[] | select(.package_name == "inceptool") | .tag] | first // ""' <<<"${RELEASES:-[]}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Builds and attaches binaries + SBOM to the release created above. Called
  # here (not via `release: published`) because releases created with
  # GITHUB_TOKEN don't trigger other workflows.
  release-assets:
    name: Release assets
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-binaries.yml # zizmor: ignore[self-repository] -- actionlint rejects `$/` (no ref)
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Opens/updates the "release PR" with version bumps + changelog entries
  # computed from conventional commits since the last release.
  release-plz-pr:
    name: Release-plz PR
    # Same guard as release-plz-release; see the comment there.
    if: >-
      github.repository_owner == 'asakura' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable # pin-comment: no vX.Y.Z tag upstream

      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
